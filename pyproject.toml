[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midusa"
version = "0.1.0"
description = "Midusa — Autonomous multi-discipline AI CAD drafting agent"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kamblossi", email = "newton.ochieng97@gmail.com" },
]
dependencies = [
    "usd-brep>=1.0.2",
    "planegcs>=0.9.6",
    "ezdxf>=1.4.5",
    "pyvista>=0.49.3",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4,<2.0.0",
    "fastmcp>=4.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"
